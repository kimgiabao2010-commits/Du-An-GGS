name: ASQ verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gss
          POSTGRES_PASSWORD: gss
          POSTGRES_DB: gss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gss -d gss_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gss:gss@127.0.0.1:5432/gss_test
      ASQ_JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  trivy-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate Trivy filesystem security evidence
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-security.json
          exit-code: '0'
          skip-dirs: node_modules,apps/standalone/.next,apps/standalone/.next-production,packages/sdk/dist,packages/cli/dist
      - name: Retain Trivy evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-${{ github.sha }}
          path: trivy-security.json
          retention-days: 30
      - name: Enforce High and Critical security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true
          skip-setup-trivy: true
          skip-dirs: node_modules,apps/standalone/.next,apps/standalone/.next-production,packages/sdk/dist,packages/cli/dist
