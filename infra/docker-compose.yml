version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: asq-postgres
    environment:
      POSTGRES_USER: asq_user
      POSTGRES_PASSWORD: asq_password
      POSTGRES_DB: asq_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: asq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: asq-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: asq-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
